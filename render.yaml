services:
  - type: web
    name: focusnest-backend
    env: python
    rootDir: focusnest-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: ALLOW_ALL_CORS
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: API_NINJAS_KEY
        sync: false
